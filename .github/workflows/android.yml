name: Android

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar o projeto Android
        run: flutter create --platforms=android --project-name nexus_cloud --org com.nexuscloud .

      - name: Ajustar o manifesto
        run: python3 ../scripts/patch_android.py android/app/src/main/AndroidManifest.xml

      - name: Ícone do app
        run: python3 -m pip install --quiet pillow && python3 ../scripts/make_icons.py ../assets/icon.png android/app/src/main/res

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: APK debug
        run: flutter build apk --debug

      - name: APK release
        run: flutter build apk --release

      - name: Publicar APK na aba Releases (download sem login)
        if: github.event_name != 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk NexusCloud.apk
          VERSION=$(grep -m1 '^version:' app/pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="v$VERSION"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --latest \
              --title "NEXUS CLOUD $VERSION" \
              --notes "Baixe NexusCloud.apk e instale no Android. O app avisa quando sair versão nova."
          gh release upload "$TAG" NexusCloud.apk -R "$GITHUB_REPOSITORY" --clobber

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: nexus-cloud-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Publicar APK release
        uses: actions/upload-artifact@v4
        with:
          name: nexus-cloud-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
