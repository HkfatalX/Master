name: MasterX Android

on:
  push:
    paths:
      - 'masterx-android/**'
      - '.github/workflows/masterx-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set +e
          gradle -p masterx-android assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|FAILED|What went wrong|Caused by|Could not|AAPT|Execution failed" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code

      - name: Rename APK
        run: |
          mkdir -p out
          cp masterx-android/app/build/outputs/apk/debug/app-debug.apk out/MasterX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MasterX
          path: out/MasterX.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: masterx-build-${{ github.run_number }}
          name: MasterX build ${{ github.run_number }}
          files: out/MasterX.apk
